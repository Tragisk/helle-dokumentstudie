# PDF-motor: startes af Dokumentstudie (Edge Function ds-pdf-start) med et job-id.
# Bygger PDF'en med udfyldelige felter og lægger den i Supabase-lageret 'ds-pdf'.
# Loggen er offentlig, så scriptet skriver aldrig dokumentindhold ud.
name: PDF
run-name: PDF-job
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job-id fra ds_pdf_jobs"
        required: true
permissions:
  contents: read
concurrency:
  group: pdf-${{ inputs.job_id }}
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pdf/requirements.txt
      - run: pip install -r pdf/requirements.txt
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pdf/requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Lav PDF
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: https://pigrfvavanlpdetlbgfn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python pdf/lav_pdf.py
